[package]
name = "artifact-sync"
version = "0.1.4"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "artifact-sync"
path = "src/main.rs"

[dependencies]
base64.workspace = true
chrono.workspace = true
clap.workspace = true
dirs.workspace = true
hex.workspace = true
hmac.workspace = true
libc.workspace = true
notify.workspace = true
rand.workspace = true
reqwest.workspace = true
rpassword.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
url.workspace = true
zeroize.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Wdk_Foundation", "Wdk_Storage_FileSystem", "Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
tempfile = "3"
